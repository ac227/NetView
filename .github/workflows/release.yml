name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端并嵌入后端
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/internal/web/dist
          cp -r dist ../backend/internal/web/dist

      - name: 交叉编译多平台二进制
        run: |
          cd backend
          mkdir -p ../release
          VERSION=${GITHUB_REF_NAME#v}
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            GOOS="${target% *}" GOARCH="${target#* }" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "../release/netview-${target% *}-${target#* }.out" ./cmd/server
          done
          # 规范命名
          mv ../release/netview-linux-amd64.out  ../release/netview-linux-amd64
          mv ../release/netview-linux-arm64.out  ../release/netview-linux-arm64
          mv ../release/netview-darwin-amd64.out ../release/netview-darwin-amd64
          mv ../release/netview-darwin-arm64.out ../release/netview-darwin-arm64
          mv ../release/netview-windows-amd64.out ../release/netview-windows-amd64.exe

      - name: 打包浏览器插件
        run: |
          cd extension
          zip -r ../release/netview-extension.zip . -x ".*"

      - name: 生成 SHA256 校验
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## NetView ${{ github.ref_name }}

            自动构建产物：

            - **netview-linux-amd64 / linux-arm64** — Linux（服务器/NAS）
            - **netview-darwin-amd64 / darwin-arm64** — macOS
            - **netview-windows-amd64.exe** — Windows
            - **netview-extension.zip** — Chrome/Edge 浏览器插件（解压后到扩展页“加载已解压的扩展程序”）

            单个二进制已内嵌前端，直接运行即可；数据默认保存在可执行文件旁 `data/` 目录。

            > 部署见项目 README：需要本机安装 PostgreSQL 16（或 Docker 容器）、ffmpeg。
